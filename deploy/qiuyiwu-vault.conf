location = /admin/vault { return 302 /admin/vault/; }
location ^~ /admin/vault/ {
    auth_request /_qy_auth;
    error_page 401 = @qy_login;
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
}
location ^~ /api/inside/vault/ {
    auth_request /_qy_auth;
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    client_max_body_size 5m;
}
location = /vault/ {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
}
location = /vault/catalog.json {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
}
location = /vault/index.html { return 302 /vault/; }
location = /admin/dashboard.html {
    auth_request /_qy_auth;
    error_page 401 = @qy_login;
    root /var/www/html;
    try_files $uri =404;
    sub_filter '</body>' '<a href="/admin/vault/" style="position:fixed;right:24px;bottom:24px;z-index:1000;background:#854530;color:white;padding:12px 20px;border-radius:8px;text-decoration:none">Vault 成果管理 ↗</a></body>';
    sub_filter_once on;
}
# Scoped read-only MCP; backend verifies its independent corpus token.
location = /api/vault-mcp {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    client_max_body_size 100k;
}
# Add a reading-mode entry at response time; keep OpenClaw's generated HTML intact.
location = /vault/reader-link.js {
    proxy_pass http://127.0.0.1:5095;
}
location ~ ^/vault/(books|reading|digest|html)/.*\.html$ {
    root /var/www/html;
    try_files $uri =404;
    sub_filter '</body>' '<script src="/vault/reader-link.js"></script></body>';
    sub_filter_once on;
}
# Preserve the existing OpenClaw dashboard and its event-driven updates.
location = /vault/analytics.html {
    root /var/www/html;
    try_files $uri =404;
    sub_filter '高频人物往往是赛道的定义者' '频率反映当前阅读样本，重要性需结合原文判断';
    sub_filter '</body>' '<script src="/vault/channel.js?v=3"></script><a href="/admin/vault/insights" style="position:fixed;right:22px;bottom:22px;background:#854530;color:white;padding:10px 18px;border-radius:24px;font:14px system-ui">跨文章证据与阅读笔记 ↗</a></body>';
    sub_filter_once on;
}
location = /vault/channel.css { proxy_pass http://127.0.0.1:5095; }
location = /vault/channel.js { proxy_pass http://127.0.0.1:5095; }
