location = /admin/vault { return 302 /admin/vault/; }
location ^~ /admin/vault/ {
    auth_request /_qy_auth;
    error_page 401 = @qy_login;
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
}
location ^~ /api/inside/vault/ {
    auth_request /_qy_auth;
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    client_max_body_size 5m;
}
location = /vault/ {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
}
location = /vault/catalog.json {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
}
location = /vault/index.html { return 302 /vault/; }
location = /admin/dashboard.html {
    auth_request /_qy_auth;
    error_page 401 = @qy_login;
    root /var/www/html;
    try_files $uri =404;
    sub_filter '<div class="tools-grid">' '<div class="tools-grid"><a class="tool-card" href="/admin/vault/app"><div class="name">Vault · 知识与阅读 ↗</div><div class="desc">管理归档内容、阅读划线与笔记、跨文章洞察和每日简报</div></a>';
    sub_filter_once on;
}
# Scoped read-only MCP; backend verifies its independent corpus token.
location = /api/vault-mcp {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    client_max_body_size 100k;
}
# Add a reading-mode entry at response time; keep OpenClaw's generated HTML intact.
location = /vault/reader-link.js {
    proxy_pass http://127.0.0.1:5095;
}
location ~ ^/vault/(books|reading|digest|html)/(.*\.html)?$ {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
}
location = /vault/analytics.html { proxy_pass http://127.0.0.1:5095; }
location = /vault/channel.css { proxy_pass http://127.0.0.1:5095; }
location = /vault/channel.js { proxy_pass http://127.0.0.1:5095; }

location ^~ /vault/annotation/ { proxy_pass http://127.0.0.1:5095; }
location ^~ /api/inside/annotations/v1/ {
    auth_request /_qy_auth;
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    client_max_body_size 50k;
}
