[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-vault"
version = "0.1.0"
description = "Agent-neutral, revisioned knowledge document publishing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vault = "agent_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
