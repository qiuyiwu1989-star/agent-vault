<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vault · 阅读与洞察</title>
<style>
:root{--paper:#faf8f3;--ink:#292623;--muted:#756e64;--line:#ded8cd;--accent:#854530}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui}header{padding:18px 4vw;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center;flex-wrap:wrap}header strong{font:600 24px Georgia,serif}a{color:var(--accent)}nav{display:flex;gap:20px;flex-wrap:wrap}main{max-width:1400px;margin:30px auto;padding:0 4vw}h1{font-size:32px;line-height:1.3}h2{font-size:20px}h3{font-size:17px}.muted,small{color:var(--muted)}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:white}input[type=checkbox]{width:auto}textarea{width:100%;min-height:95px}button:hover{border-color:var(--accent)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card,.note{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}.card b{display:block;font-size:28px;font-weight:500}.note blockquote{margin:6px 0;padding-left:12px;border-left:3px solid #dfbc64;white-space:pre-wrap}.text{white-space:pre-wrap;overflow-wrap:anywhere;font:18px/1.95 Georgia,'Noto Serif SC',serif;background:#fffefb;padding:32px;border:1px solid var(--line);border-radius:10px}.text mark{background:#f4dfa0;cursor:pointer}.text mark.active{background:#e8b771}.list{display:grid;gap:10px}.list button{text-align:left;width:100%}.list small{display:block}.bar{height:7px;background:#dfc8a7;border-radius:3px;margin-top:6px}.side{position:sticky;top:20px;align-self:start;max-height:90vh;overflow:auto}.status{padding:10px 0;color:var(--accent);min-height:32px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td button{border:0;background:none;padding:0;color:var(--accent)}details{margin:12px 0}#timeline{display:flex;align-items:end;gap:3px;height:100px;overflow-x:auto}.daybar{min-width:12px;background:#ae7b54;position:relative}.daybar:hover{background:var(--accent)}.tag{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-right:6px}.hidden{display:none!important}#selection{border:1px solid #dcb975;background:#fff8e5}#selectedQuote{max-height:120px;overflow:auto;white-space:pre-wrap}.brieftext{font:18px/1.9 Georgia,serif;white-space:pre-wrap}.empty{padding:22px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:1fr}.side{position:static;max-height:none}.text{padding:18px;font-size:17px}header{gap:12px}table{font-size:13px}th,td{padding:7px}main{padding:0 18px}}
</style><header><strong>Vault</strong><nav><a href="/admin/vault/read">阅读与笔记</a><a href="/admin/vault/insights">信息看板</a><a href="/admin/vault/brief">每日简报</a><a href="/admin/vault/">内容管理</a><a href="/vault/analytics.html" target="_blank" rel="noopener">归档数据看板 ↗</a><a href="/vault/" target="_blank" rel="noopener">公开成果 ↗</a></nav></header><main><div id="status" class="status" role="status"></div><div id="app"></div></main>
<script>
const TOKEN=__VAULT_CSRF__;const $=s=>document.querySelector(s);let current=null,notes=[],selection=null,editNote=null,entities=[],utterance=null;
const api=async(path,data)=>{const r=await fetch('/api/inside/vault/knowledge/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-Vault-Token':TOKEN},body:data?JSON.stringify(data):undefined});if(r.status===401){location.href='/admin/login.html?next='+encodeURIComponent(location.pathname+location.search);throw Error('请先登录')}const x=await r.json();if(!r.ok)throw Error(x.error||'操作失败');return x};
function message(t){$('#status').textContent=t}async function run(fn){try{await fn()}catch(e){message(e.message)}}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function link(text,url){const a=el('a',text);a.href=url;return a}function readLink(d){return link(d.title,'/admin/vault/read?id='+encodeURIComponent(d.id))}function safeExternal(a){a.target='_blank';a.rel='noopener noreferrer';return a}
function itemCard(d){const card=el('article',undefined,'card');card.append(el('small',(d.date||'日期未标注')+' · '+(d.kind==='summary'?'仅历史摘要':'全文')),readLink(d));if(d.trust)card.append(el('small',d.trust));if(d.summary)card.append(el('p',d.summary.slice(0,210)));return card}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function reader(){
 let id=new URLSearchParams(location.search).get('id');const sourceUrl=new URLSearchParams(location.search).get('url');if(!id&&!sourceUrl){$('#app').innerHTML='<h1>阅读与笔记</h1><p class="muted">选中正文即可划线、写评论；阅读痕迹只在登录后的工作台中可见。</p><div class="tools"><input id="search" placeholder="搜索全文、人物或主题" aria-label="搜索全文"><button id="find">搜索</button><button id="myNotes">我的笔记</button></div><div id="results" class="cards"></div>';
 const show=async()=>{const rows=await api('search?q='+encodeURIComponent($('#search').value));$('#results').replaceChildren(...rows.map(itemCard));message(rows.length+' 条结果')};$('#find').onclick=()=>run(show);$('#search').onkeydown=e=>{if(e.key==='Enter')run(show)};$('#myNotes').onclick=()=>run(async()=>{const ns=await api('notes');$('#results').replaceChildren(...ns.map(n=>{const c=el('article',undefined,'note');c.append(readLink({id:n.doc_id,title:n.title}),el('blockquote',n.quote),el('p',n.comment||'仅划线'));return c}));message(ns.length?'':'还没有笔记。打开一篇文章，选择一段正文试试。')});await show();return}
 current=await api('read?'+(id?'id='+encodeURIComponent(id):'url='+encodeURIComponent(sourceUrl)));id=current.id;notes=await api('notes?doc_id='+encodeURIComponent(id));
 $('#app').innerHTML='<div class="tools"><a href="/admin/vault/read">← 全部文章</a><a id="original" target="_blank" rel="noopener">查看原版 HTML／原始来源 ↗</a><button id="export">导出讨论材料</button><label><input type="checkbox" id="withNotes">包含我的私人笔记</label></div><h1 id="title"></h1><p id="docMeta" class="muted"></p><div class="grid"><article id="body" class="text"></article><aside class="side"><div id="selection" class="card hidden"><strong id="editorTitle">留下阅读痕迹</strong><p id="selectedQuote"></p><textarea id="comment" aria-label="评论" placeholder="写下你的判断、疑问或联想到的项目…（也可只保存划线）"></textarea><div class="tools"><button id="saveNote" class="primary">保存划线与评论</button><button id="cancel">取消</button></div></div><h2>我的笔记</h2><div id="notes"></div><h2>跨文章继续读</h2><p class="muted">按共同人物或关键词关联，不代表观点一致。</p><div id="related" class="list"></div></aside></div>';
 $('#title').textContent=current.title;$('#docMeta').textContent=(current.date||'日期未标注')+' · '+current.trust+' · '+(current.kind==='summary'?'历史摘要：尚未读取飞书全文':'阅读模式：保留正文文字，图片及交互请打开原版');if(current.url)$('#original').href=current.url;else $('#original').remove();drawNotes();
 $('#body').addEventListener('mouseup',capture);$('#body').addEventListener('touchend',()=>setTimeout(capture,80));
 $('#cancel').onclick=()=>{$('#selection').classList.add('hidden');selection=null;editNote=null};
 $('#saveNote').onclick=()=>run(async()=>{if(!selection&&!editNote)throw Error('请先选中正文');$('#saveNote').disabled=true;try{await api('note-save',editNote?{id:editNote.id,doc_id:current.id,expected:editNote.version,comment:$('#comment').value}:{doc_id:current.id,content_hash:current.hash,...selection,comment:$('#comment').value});notes=await api('notes?doc_id='+encodeURIComponent(current.id));$('#selection').classList.add('hidden');selection=null;editNote=null;drawNotes();message('已保存到数据库，重新打开仍可查看。')}finally{$('#saveNote').disabled=false}});
 $('#export').onclick=()=>run(async()=>download('vault-discussion.json',await api('pack',{ids:[current.id],include_notes:$('#withNotes').checked})));
 const related=await api('related?id='+encodeURIComponent(id));$('#related').replaceChildren(...related.map(r=>{const c=el('div',undefined,'card');c.append(readLink(r),el('small','共同出现：'+r.shared.join('、')));return c}));
}
function capture(){const s=window.getSelection();if(!s||s.isCollapsed||!$('#body').contains(s.anchorNode)||!$('#body').contains(s.focusNode))return;const range=s.getRangeAt(0),pre=range.cloneRange();pre.selectNodeContents($('#body'));pre.setEnd(range.startContainer,range.startOffset);const start=Array.from(pre.toString()).length,quote=range.toString();if(!quote.trim())return;selection={start,end:start+Array.from(quote).length,quote};editNote=null;$('#comment').value='';$('#selectedQuote').textContent=quote;$('#editorTitle').textContent='留下阅读痕迹';$('#selection').classList.remove('hidden')}
function drawNotes(){const chars=Array.from(current.text),spans=notes.filter(n=>n.anchor.status!=='unresolved'),cuts=[...new Set([0,chars.length,...spans.flatMap(n=>[n.anchor.start,n.anchor.end])])].sort((a,b)=>a-b);const fragment=document.createDocumentFragment();for(let i=0;i<cuts.length-1;i++){const a=cuts[i],b=cuts[i+1],found=spans.filter(n=>n.anchor.start<=a&&n.anchor.end>=b);const t=chars.slice(a,b).join('');if(!found.length)fragment.append(document.createTextNode(t));else{const m=el('mark',t);m.title=found.map(n=>n.comment||'已划线').join('\n');m.onclick=()=>{if(window.getSelection()?.isCollapsed)showNote(found[0])};fragment.append(m)}}$('#body').replaceChildren(fragment);$('#notes').replaceChildren(...notes.map(n=>{const c=el('div',undefined,'note');c.append(el('blockquote',n.quote),el('p',n.comment||'仅划线'),el('small',n.anchor.status==='unresolved'?'正文已变化，位置待重新确认':n.anchor.status==='relocated'?'正文已变化，按引用重新定位':'已保存 · v'+n.version));const b=el('button','编辑评论');b.onclick=()=>showNote(n);c.append(b);return c}));if(!notes.length)$('#notes').append(el('p','选中一段文字，留下第一条笔记。','muted'))}
function showNote(n){editNote=n;selection=null;$('#selectedQuote').textContent=n.quote;$('#comment').value=n.comment;$('#editorTitle').textContent='编辑评论（保留原划线）';$('#selection').classList.remove('hidden')}
async function insights(){
 $('#app').innerHTML='<h1>跨文章洞察</h1><p><a href="/vault/analytics.html" target="_blank" rel="noopener">查看 OpenClaw 归档看板 ↗</a> · 本页补充全文证据、历史摘要和私人阅读痕迹。</p><p class="muted">先看信息从哪里来、反复出现什么，再回到证据讨论。</p><div class="tools"><label>从 <input type="date" id="from"></label><label>到 <input type="date" id="to"></label><select id="collection" aria-label="语料范围"><option value="">全部语料</option><option value="reading">阅读档案</option><option value="books">榨书档案</option><option value="digest">Vault 日报全文</option><option value="html">HTML 成果</option><option value="builders">AI 建设者历史摘要</option></select><button id="filter">更新看板</button></div><div id="metrics" class="cards"></div><p id="coverage" class="muted"></p><details><summary>统计口径与覆盖边界</summary><p id="method"></p></details><details><summary>信源层级与已有标签</summary><p id="trusts"></p><p id="tags"></p></details><h2>按文稿日期的信息摄入</h2><div id="timeline"></div><div class="grid"><section><div class="tools"><select id="kind" aria-label="实体类型"><option value="person">人物</option><option value="wechat">公众号</option><option value="source">外链来源域名</option><option value="topic">主题关键词</option><option value="organization">组织</option></select><input id="entityQ" aria-label="搜索实体" placeholder="搜索名称"></div><table><thead><tr><th>名称</th><th>文档数</th><th>提及／外链数</th><th>最近日期</th></tr></thead><tbody id="entities"></tbody></table><details><summary>维护人物、公众号或别名</summary><p class="muted">同一个实体的别名会合并计数；身份不确定时先查看原文。输入同名项可更新别名。</p><div class="tools"><select id="newKind"><option value="person">人物</option><option value="wechat">公众号</option><option value="organization">组织</option><option value="topic">主题</option></select><input id="entityName" aria-label="实体名称" placeholder="规范名称"><input id="aliases" aria-label="别名" placeholder="别名，以逗号分隔"><button id="saveEntity">保存实体</button></div></details></section><aside id="evidence"><p class="empty">点击左侧名称，查看涉及哪些文章、原文提到了什么。</p></aside></div><details><summary>分享给其他 Agent · MCP</summary><p>只读 MCP 提供全文检索、原文读取、实体统计与证据查询。连接凭据不允许修改文章，也不能读取私人笔记。</p><p>接口：<code>https://qiuyiwu.com/api/vault-mcp</code></p><button id="mcpConfig">下载带只读凭据的 MCP 配置</button><p class="muted">配置文件含访问凭据，只交给你授权的 Agent。包含私人笔记的讨论材料请从阅读页单独勾选导出。</p></details>';
 async function refresh(){message('正在按原文统计…');const q=new URLSearchParams({start:$('#from').value,end:$('#to').value,collection:$('#collection').value});const x=await api('analytics?'+q);entities=x.entities;$('#metrics').replaceChildren(...[['全文',x.fulltext],['历史摘要',x.summaries],['我的笔记（全部）',x.notes],['有笔记的文章（全部）',x.marked]].map(([label,value])=>{const c=el('div',undefined,'card');c.append(el('small',label),el('b',String(value)));return c}));$('#coverage').textContent='AI 建设者摘要索引截止 '+(x.builders_latest||'暂无')+'；当前筛选中 '+x.unknown_dates+' 篇未标注文稿日期。完全相同正文去重 '+x.duplicates_skipped+' 份。';$('#method').textContent=x.method;$('#trusts').textContent=Object.entries(x.trust_levels).map(([k,v])=>k+'：'+v).join(' · ');$('#tags').textContent=Object.entries(x.tags).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([k,v])=>k+' '+v).join(' · ');const max=Math.max(1,...x.timeline.map(d=>d[1]));$('#timeline').replaceChildren(...x.timeline.map(([day,n])=>{const b=el('div',undefined,'daybar');b.style.height=(10+90*n/max)+'px';b.title=day+'：'+n+' 份';return b}));drawEntities();message('统计完成：'+x.total+' 份文档，点击实体查看证据。')}
 $('#filter').onclick=()=>run(refresh);$('#kind').onchange=$('#entityQ').oninput=drawEntities;$('#saveEntity').onclick=()=>run(async()=>{await api('entity-save',{name:$('#entityName').value,kind:$('#newKind').value,aliases:$('#aliases').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)});await refresh();message('实体与别名已保存')});$('#mcpConfig').onclick=()=>run(async()=>download('vault-mcp-config.json',await api('mcp-config')));await refresh();
}
function drawEntities(){const rows=entities.filter(e=>e.kind===$('#kind').value&&e.name.toLowerCase().includes($('#entityQ').value.toLowerCase()));$('#entities').replaceChildren(...rows.map(e=>{const tr=el('tr'),td=el('td'),b=el('button',e.name);b.onclick=()=>showEvidence(e);td.append(b,el('small',e.confirmed?'用户维护':'原文线索／未人工核验'));tr.append(td,el('td',String(e.documents)),el('td',String(e.mentions)),el('td',e.latest||'未标注'));return tr}));if(!rows.length){const tr=el('tr'),td=el('td','暂无明确条目，可手动添加实体或别名。');td.colSpan=4;tr.append(td);$('#entities').append(tr)}}
function showEvidence(e){$('#evidence').replaceChildren(el('h2',e.name),el('p',e.fulltext_documents+' 篇全文 + '+e.summary_documents+' 条摘要；不是全网出现次数。','muted'),el('p','识别依据：'+e.basis,'muted'));const exportButton=el('button','导出前 10 篇讨论材料');exportButton.onclick=()=>run(async()=>download('vault-'+e.kind+'-evidence.json',await api('pack',{ids:e.evidence.slice(0,10).map(x=>x.id),include_notes:false})));$('#evidence').append(exportButton);for(const d of e.evidence){const c=el('article',undefined,'card');c.append(readLink(d),el('small',(d.date||'未标日期')+' · '+(d.kind==='summary'?'摘要':'全文')+' · '+d.count+' 次'),el('p',d.snippet));$('#evidence').append(c)}}
async function briefing(){
 $('#app').innerHTML='<h1>每日内容简报</h1><p class="muted">像一次工作汇报：近期信息、你的阅读痕迹，以及值得继续追问的问题。</p><div class="tools"><input id="day" type="date" aria-label="简报日期"><button id="generate">生成／刷新简报</button><button id="speak" class="primary">▶ 听简报</button><button id="pause">暂停／继续</button><button id="stop">停止</button></div><p id="briefMeta" class="muted"></p><div class="grid"><article id="script" class="card brieftext"></article><aside><h2>本期资料</h2><div id="sources"></div><h2>带着问题继续讨论</h2><div id="questions"></div><button id="briefExport">导出本期资料（不含笔记）</button></aside></div>';
 let brief;async function generate(){if('speechSynthesis' in window)speechSynthesis.cancel();brief=await api('brief'+($('#day').value?'?day='+$('#day').value:''));$('#day').value=brief.day;$('#script').textContent=brief.script;$('#briefMeta').textContent=brief.method;$('#sources').replaceChildren(...brief.items.map(itemCard));$('#questions').replaceChildren(...brief.questions.map(q=>el('p',q)));message('已生成并保存本期简报。朗读使用当前浏览器语音，尚未生成音频文件。')}
 $('#generate').onclick=()=>run(generate);$('#speak').onclick=()=>run(async()=>{if(!('speechSynthesis' in window))throw Error('当前浏览器不支持朗读，请换用支持语音的浏览器');speechSynthesis.cancel();const parts=brief.script.match(/[\s\S]{1,180}/g)||[brief.script];for(const text of parts){const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1;u.onerror=()=>message('浏览器朗读失败，文字简报仍可阅读。');speechSynthesis.speak(u)}message('正在朗读；可暂停后围绕本期问题讨论。')});$('#pause').onclick=()=>{if(!('speechSynthesis' in window))return;speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause()};$('#stop').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel()};$('#briefExport').onclick=()=>run(async()=>download('vault-brief-'+brief.day+'.json',await api('pack',{ids:brief.items.map(x=>x.id),include_notes:false})));await generate();
}
run(async()=>{if(location.pathname.endsWith('/insights'))await insights();else if(location.pathname.endsWith('/brief'))await briefing();else await reader()});
</script></html>
