<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爪爪收件箱 · 知行档案</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px/1.6 system-ui}
#inbox{max-width:1800px;margin:auto;padding:24px 32px}#inbox .inbox-head{display:flex;align-items:center;gap:20px;justify-content:space-between}#inbox h1{font-size:24px;margin:0}#inbox .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 12px}#inbox input,#inbox button{font:inherit;color:inherit}#inbox input,.inbox-action{padding:9px 14px;border:1px solid #a5a89f66;border-radius:10px;background:var(--v-bg,#faf9f5)}#inbox input[type=search]{flex:1;min-width:180px}button{cursor:pointer}button:disabled{opacity:.5}#status{font-size:13px;color:var(--v-muted,#74766d);min-height:24px;margin:8px 0 16px}#grid{position:relative;width:100%}
#grid .pin{position:absolute;display:block;margin:0;padding:0;border:0;border-radius:14px;overflow:hidden;background:#dadbd533;box-shadow:none;text-align:left;isolation:isolate;cursor:zoom-in}#grid .pin img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .18s}#grid .pin.loaded img{opacity:1}#grid .pin:hover{box-shadow:0 0 0 2px #72796b66}#grid .pin:focus-visible{outline:3px solid #3c765f;outline-offset:3px}#grid .pin.failed:after{content:'加载失败 · 点击重试';position:absolute;inset:0;display:grid;place-items:center;font-size:13px;background:var(--v-bg,#faf9f5)}#more{display:block;margin:20px auto}#sentinel{height:1px}#login{display:none}
#detail{width:min(1200px,96vw);max-height:94vh;border:0;border-radius:18px;padding:22px;color:var(--v-ink,#28372f);background:var(--v-bg,#faf9f5)}#detail::backdrop{background:#17251ec7}#detail header{display:flex;justify-content:space-between;gap:20px;align-items:center}#title{overflow-wrap:anywhere}#detail .detail-body{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:24px;margin-top:16px}#original{width:100%;max-height:74vh;object-fit:contain}#detail pre{white-space:pre-wrap;font:inherit;overflow-wrap:anywhere;max-height:35vh;overflow:auto}#detail a{color:#54846a}#detail-status{font-size:13px}#detail aside{min-width:0}
@media(max-width:700px){#inbox{padding:18px 14px}#inbox h1{font-size:21px}#inbox input[type=date]{max-width:145px}#detail .detail-body{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){#grid .pin img{transition:none}}

.tabs{display:flex;gap:8px}.tabs [aria-pressed=true]{background:#315d4a;color:white!important}.privacy{font-size:12px;color:#656e65}.note-pin{padding:20px!important;background:#f0eee7!important;cursor:pointer!important;color:#28372f}.note-pin strong{display:block;font-size:19px;line-height:1.4;margin-bottom:12px}.note-pin p{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical}.note-kind{font-size:12px;color:#5e6a61}
#editor,#note-detail{width:min(1080px,96vw);max-height:94vh;overflow:auto;border:0;border-radius:16px;padding:24px;background:var(--v-bg,#faf9f5);color:var(--v-ink,#28372f)}dialog::backdrop{background:#17251ec7}dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}.editor-fields{display:grid;gap:10px;margin-top:16px}.editor-fields input,.editor-fields textarea{font:inherit;padding:12px;border:1px solid #abb1a6;border-radius:8px;width:100%;background:transparent;color:inherit}.editor-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.editor-columns textarea{min-height:45vh;resize:vertical}.markdown{overflow-wrap:anywhere;line-height:1.8}.markdown img{max-width:100%;height:auto;border-radius:8px}.markdown pre{padding:12px;background:#8881;overflow:auto;white-space:pre-wrap}.markdown blockquote{border-left:3px solid #69917c;margin-left:0;padding-left:14px}.markdown a{color:#315d4a}.markdown code{background:#8881}.editor-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#editor-status{font-size:13px;white-space:pre-wrap}.external-image{display:block;padding:12px;background:#8881}#note-detail-body{max-width:800px;margin:20px auto}.meta{font-size:13px;color:#657065}button:focus-visible{outline:3px solid #3c765f;outline-offset:3px}@media(max-width:700px){.editor-columns{grid-template-columns:1fr}.editor-columns textarea{min-height:30vh}}
</style></head><body><main id="inbox">
<header class="inbox-head"><h1>爪爪收件箱</h1><div><button class="inbox-action" id="new-note">＋ 新建笔记</button> <button class="inbox-action" id="refresh">刷新</button></div></header>
<div class="filters"><input id="q" type="search" placeholder="搜索图片文字、笔记或标签" aria-label="搜索收件箱"><input id="day" type="date" aria-label="采集日期"><button class="inbox-action" id="clear">全部日期</button></div>
<div class="tabs" role="group" aria-label="素材类型"><button class="inbox-action" data-kind="all" aria-pressed="true">全部</button><button class="inbox-action" data-kind="image" aria-pressed="false">图片</button><button class="inbox-action" data-kind="note" aria-pressed="false">笔记</button></div><details class="privacy"><summary>体验数据</summary><label><input id="metrics" type="checkbox"> 帮助改进体验（仅操作次数与耗时，不含内容，随时关闭）</label><p>仅保存按天聚合的统计，保留 30 天，不保存原始事件，不记录正文、搜索词、网址或用户会话。</p><button class="inbox-action" id="view-metrics">查看近 7 天</button><p id="metrics-result" role="status"></p></details><p id="status" role="status">正在加载图片…</p><a id="login" href="/admin/login.html?next=/vault/inbox/">登录后查看</a>
<section id="grid" aria-label="图片瀑布流"></section><div id="sentinel"></div><button class="inbox-action" id="more" hidden>加载更多</button>
<dialog id="detail"><header><strong id="title"></strong><button class="inbox-action" id="close">关闭 Esc</button></header><p id="detail-status" role="status"></p><div class="detail-body"><a id="full" target="_blank" rel="noopener noreferrer"><img id="original" alt="原图预览" referrerpolicy="no-referrer"></a><aside><p id="date"></p><p id="tags"></p><h3>备注</h3><pre id="note"></pre><h3>识别文字</h3><button class="inbox-action" id="copy">复制文字</button><pre id="ocr"></pre><a id="download" download>保存原图</a></aside></div></dialog>
<dialog id="note-detail"><header><strong id="note-title"></strong><div><button class="inbox-action" id="edit-note">编辑笔记</button> <button class="inbox-action" id="close-note">关闭 Esc</button></div></header><p id="note-meta" class="meta"></p><article id="note-detail-body" class="markdown"></article></dialog>
<dialog id="editor"><header><strong>图文笔记</strong><button class="inbox-action" id="close-editor">关闭 · 保留草稿</button></header><div class="editor-fields"><input id="note-name" aria-label="笔记标题" placeholder="标题（可选）" maxlength="512"><div class="editor-columns"><div><label for="markdown-input">Markdown 原文</label><textarea id="markdown-input" placeholder="写下想法，或粘贴文字…
也可以粘贴、拖入图片。" maxlength="500000"></textarea></div><div><span>排版预览</span><article class="markdown" id="markdown-preview"></article></div></div><input id="note-tags" maxlength="4000" aria-label="标签" placeholder="标签（用逗号分隔）"><input id="note-source" maxlength="2048" aria-label="来源网址" placeholder="来源网址（可选）" type="url"></div><p class="meta">支持标题、列表、引用、代码、链接与图片。外部图片默认不加载；上传图片后插入永久引用。</p><div class="editor-actions"><button class="inbox-action" id="save-note">保存到知行档案</button><button class="inbox-action" id="save-copy" hidden>将当前草稿另存为新笔记</button><button class="inbox-action" id="add-image">插入图片</button><button class="inbox-action" id="import-note">导入 .md / .txt</button><button class="inbox-action" id="discard-draft">清除草稿并新建</button><input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif,image/tiff" hidden multiple><input type="file" id="text-file" accept=".md,.txt,text/plain,text/markdown" hidden></div><p id="editor-status" role="status"></p></dialog>
<script>
const $=id=>document.getElementById(id);
let offsets={image:0,note:0},remaining={image:true,note:true},kind="all",generation=0,timer,current=null,loading=false,hasMore=false,controller,detailGeneration=0;
let pins=[];const seen=new Set();
function layout(){
 const width=$('grid').clientWidth,gap=width<640?10:16;
 const columns=width<640?(width<300?1:2):Math.max(2,Math.floor((width+gap)/240));
 const cardWidth=(width-gap*(columns-1))/columns,heights=Array(columns).fill(0);
 for(const {card,item} of pins){const column=heights.indexOf(Math.min(...heights));const height=item.kind==='note'?Math.min(340,Math.max(190,100+Math.ceil((item.excerpt||'').length/18)*24)):cardWidth*item.height/item.width;
  Object.assign(card.style,{width:cardWidth+'px',height:height+'px',left:column*(cardWidth+gap)+'px',top:heights[column]+'px'});heights[column]+=height+gap;
 }
 $('grid').style.height=Math.max(0,...heights)- (pins.length?gap:0)+'px';
}
new ResizeObserver(layout).observe($('grid'));
function append(item){
 const key=item.kind==='note'?'note:'+item.id:'image:'+item.digest;if(seen.has(key))return;seen.add(key);
 if(item.kind==='note'){const card=document.createElement('button');card.className='pin note-pin';const label=document.createElement('span');label.className='note-kind';label.textContent='笔记';const heading=document.createElement('strong');heading.textContent=item.title||'未命名笔记';const excerpt=document.createElement('p');excerpt.textContent=item.excerpt||'打开笔记';card.append(label,heading,excerpt);card.onclick=()=>showNote(item);$('grid').append(card);pins.push({card,item});return}
 const card=document.createElement('button');card.className='pin';card.setAttribute('aria-label','预览：'+(item.name||'采集图片'));
 const img=document.createElement('img');img.alt='';img.width=item.width;img.height=item.height;img.decoding='async';img.loading=pins.length<6?'eager':'lazy';img.referrerPolicy='no-referrer';if(pins.length<3)img.fetchPriority='high';
 img.onload=()=>{card.classList.add('loaded');card.classList.remove('failed')};img.onerror=()=>card.classList.add('failed');
 card.onclick=()=>{if(card.classList.contains('failed')){card.classList.remove('failed');img.src='/api/zhuazhua/thumbnail/'+item.digest+'?retry='+Date.now()}else show(item)};
 img.src=item.thumbnailURL;card.append(img);$('grid').append(card);pins.push({card,item});
}
async function show(item){
 const gen=++detailGeneration;current=null;$('title').textContent=item.name||'采集图片';$('original').src=item.thumbnailURL;
 $('full').removeAttribute('href');$('download').removeAttribute('href');$('date').textContent='';$('tags').textContent='';$('note').textContent='';$('ocr').textContent='';$('copy').disabled=true;$('detail-status').textContent='正在读取原图与笔记…';$('detail').showModal();
 try{const response=await fetch('/api/zhuazhua/captures/'+item.digest,{credentials:'same-origin'});if(!response.ok)throw Error('详情暂时无法加载，请关闭后重试');const data=await response.json();if(gen!==detailGeneration)return;current=data;
 $('date').textContent='采集于 '+new Date(data.collectedAt).toLocaleString('zh-CN')+' · '+data.width+' × '+data.height;
 $('tags').textContent=data.tags?'标签：'+data.tags:'';$('note').textContent=data.note||'暂无备注';$('ocr').textContent=data.ocr||'暂无识别文字';$('copy').disabled=!data.ocr;
 $('full').href=data.displayURL;$('download').href=data.imageURL;$('download').download=data.name||'capture';
 const original=new Image();original.referrerPolicy='no-referrer';original.onload=()=>{if(gen===detailGeneration){$('original').src=original.src;$('detail-status').textContent=''}};original.onerror=()=>{if(gen===detailGeneration)$('detail-status').textContent='原图加载失败，当前显示缩略图，可点击图片重试'};original.src=data.displayURL;
 }catch(e){if(gen===detailGeneration)$('detail-status').textContent=e.message}
}
async function load(reset=true){
 if(!reset&&(loading||!hasMore))return;
 if(reset){controller?.abort();generation++;offsets={image:0,note:0};remaining={image:true,note:true};hasMore=false;pins=[];seen.clear();$('grid').replaceChildren();layout()}
 const gen=generation;controller=new AbortController();loading=true;$('more').disabled=true;$('status').textContent='正在加载…';const started=performance.now();
 try{const types=(kind==='all'?['image','note']:[kind]).filter(t=>remaining[t]);
 const batches=await Promise.all(types.map(async t=>{const response=await fetch('/api/zhuazhua/'+(t==='image'?'captures':'notes')+'?'+new URLSearchParams({q:$('q').value,day:$('day').value,offset:offsets[t],summary:'1',limit:'24'}),{credentials:'same-origin',signal:controller.signal});if(response.status===401){$('login').style.display='inline';throw Error('登录已过期，请重新登录')}if(!response.ok)throw Error('加载失败，点击刷新重试');return {type:t,data:await response.json()}}));if(gen!==generation)return;
 for(const {type,data} of batches){data.items.forEach(item=>append({...item,kind:type}));offsets[type]+=data.items.length;remaining[type]=data.more}
 hasMore=(kind==='all'?['image','note']:[kind]).some(t=>remaining[t]);layout();$('login').style.display='none';$('more').hidden=!hasMore;$('status').textContent=pins.length?pins.length+' 项':'没有匹配的素材';track($('q').value?'search_completed':'inbox_list_loaded',{count:Math.min(pins.length,1000),durationMs:performance.now()-started});
 }catch(e){if(e.name!=='AbortError'&&gen===generation){hasMore=false;$('more').hidden=true;$('status').textContent=e.message}}
 finally{if(gen===generation){loading=false;$('more').disabled=false;requestAnimationFrame(()=>{if(hasMore&&$('sentinel').getBoundingClientRect().top<innerHeight+500)load(false)})}}
}
new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))load(false)},{rootMargin:'500px'}).observe($('sentinel'));
$('q').oninput=()=>{clearTimeout(timer);controller?.abort();generation++;timer=setTimeout(()=>load(),250)};$('day').onchange=()=>load();$('clear').onclick=()=>{$('day').value='';load()};$('refresh').onclick=()=>load();$('more').onclick=()=>load(false);
$('close').onclick=()=>$('detail').close();$('detail').onclose=()=>{detailGeneration++;$('original').removeAttribute('src')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(current?.ocr||'');$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制文字',1500)}catch{$('copy').textContent='请选择下方文字复制'}};

/* Markdown is rendered only through DOM text nodes. No HTML or arbitrary image URLs. */
function safeURL(value){try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)?url.href:null}catch{return null}}
function inlineMarkdown(text,parent){
 const pattern=/(!?\[([^\]]*)\]\(([^\s)]+)\)|`([^`]+)`|\*\*([^*]+)\*\*)/g;let start=0,m;
 while((m=pattern.exec(text))){parent.append(document.createTextNode(text.slice(start,m.index)));let node;
 if(m[4]!==undefined){node=document.createElement('code');node.textContent=m[4]}
 else if(m[5]!==undefined){node=document.createElement('strong');node.textContent=m[5]}
 else if(m[1].startsWith('!')){if(/^\/api\/zhuazhua\/image\/[a-f0-9]{64}$/.test(m[3])){node=document.createElement('img');node.src=m[3];node.alt=m[2];node.loading='lazy';node.referrerPolicy='no-referrer'}else{node=document.createElement('span');node.className='external-image';node.textContent='[外部图片未加载：'+(m[2]||'图片')+']'}}
 else{const href=safeURL(m[3]);node=document.createElement(href?'a':'span');node.textContent=m[2];if(href){node.href=href;node.target='_blank';node.rel='noopener noreferrer';node.referrerPolicy='no-referrer'}}
 parent.append(node);start=pattern.lastIndex}parent.append(document.createTextNode(text.slice(start)));
}
function renderMarkdown(text,target){target.replaceChildren();let code=null,list=null;
 for(const line of text.replace(/\r/g,'').split('\n')){if(/^```/.test(line)){if(code)code=null;else{const pre=document.createElement('pre');code=document.createElement('code');pre.append(code);target.append(pre)}list=null;continue}if(code){code.append(document.createTextNode(line+'\n'));continue}if(!line.trim()){list=null;continue}
 const item=line.match(/^\s*([-*+] |\d+\. )(.*)$/);if(item){const tag=/^\d/.test(item[1])?'ol':'ul';if(!list||list.tagName.toLowerCase()!==tag){list=document.createElement(tag);target.append(list)}const li=document.createElement('li');inlineMarkdown(item[2],li);list.append(li);continue}list=null;
 const heading=line.match(/^(#{1,6}) (.*)$/),quote=line.match(/^> ?(.*)$/);const node=document.createElement(heading?'h'+heading[1].length:quote?'blockquote':'p');inlineMarkdown(heading?heading[2]:quote?quote[1]:line,node);target.append(node)}
}
const draftKey='zhuazhua.note-draft.v1';let editing=null,openedNote=null,saving=false,uploading=false,localDraftAvailable=false;
function readLocal(key){try{return localStorage.getItem(key)}catch{return null}}
$('metrics').checked=readLocal('zhuazhua.metrics')==='yes';$('metrics').onchange=()=>{try{localStorage.setItem('zhuazhua.metrics',$('metrics').checked?'yes':'no')}catch{}};
function track(event,fields={}){if(!$('metrics').checked)return;fetch('/api/zhuazhua/events',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,source:"web",outcome:event.endsWith("failed")?"failure":"success",...fields,durationMs:Math.min(600000,Math.round(fields.durationMs||0))})}).catch(()=>{})}
function draft(){return {...editing,title:$('note-name').value,markdown:$('markdown-input').value,tags:$('note-tags').value,sourceURL:$('note-source').value}}
function stash(){try{localStorage.setItem(draftKey,JSON.stringify(draft()));localDraftAvailable=true;return true}catch{localDraftAvailable=false;$('editor-status').textContent='本机草稿存储不可用，请先保存到知行档案，关闭页面会丢失未保存修改';return false}}
function fillEditor(data){editing={...data};$('note-name').value=data.title||'';$('markdown-input').value=data.markdown||'';$('note-tags').value=data.tags||'';$('note-source').value=data.sourceURL||'';renderMarkdown(data.markdown||'',$('markdown-preview'))}
function blankNote(){return {id:crypto.randomUUID(),version:0,collectedAt:new Date().toISOString(),attachments:[]}}
function openEditor(data){let saved=null;try{saved=JSON.parse(readLocal(draftKey)||'null')}catch{}if(saved&&(!data||saved.id!==data.id)){fillEditor(saved);$('editor-status').textContent='已恢复未保存草稿。保存或清除草稿后，可编辑其他笔记。'}else{fillEditor(saved||data||blankNote());$('editor-status').textContent=saved?'已恢复本机草稿':'草稿自动保存在当前浏览器'}$('save-copy').hidden=true;$('editor').showModal();track('note_editor_opened')}
async function showNote(item){const started=performance.now();$('note-title').textContent=item.title||'笔记';$('note-detail-body').textContent='正在加载…';$('note-meta').textContent='';$('edit-note').disabled=true;$('note-detail').showModal();const id=++detailGeneration;try{const r=await fetch('/api/zhuazhua/notes/'+item.id,{credentials:'same-origin'});if(!r.ok)throw Error('加载失败，请关闭后重试');const data=await r.json();if(id!==detailGeneration)return;openedNote=data;renderMarkdown(data.markdown,$('note-detail-body'));$('note-title').textContent=data.title||'未命名笔记';$('note-meta').textContent='采集于 '+new Date(data.collectedAt).toLocaleString('zh-CN')+' · '+(data.tags||'');$('edit-note').disabled=false;track('note_opened',{durationMs:performance.now()-started})}catch(e){if(id===detailGeneration)$('note-detail-body').textContent=e.message}}
$('new-note').onclick=()=>openEditor();$('close-editor').onclick=()=>{if(!saving&&!uploading)$('editor').close()};$('editor').onclose=()=>{if(editing)stash()};$('close-note').onclick=()=>$('note-detail').close();$('note-detail').onclose=()=>detailGeneration++;$('edit-note').onclick=()=>{const data=openedNote;$('note-detail').close();openEditor(data)};
for(const id of ['note-name','markdown-input','note-tags','note-source'])$(id).oninput=()=>{editing.modifiedAt=new Date().toISOString();stash();renderMarkdown($('markdown-input').value,$('markdown-preview'))};
$('discard-draft').onclick=()=>{if(!confirm('清除这份未保存的本机草稿？已保存的笔记不受影响。'))return;try{localStorage.removeItem(draftKey)}catch{}fillEditor(blankNote());$('editor-status').textContent='已新建空白笔记'};
$('save-note').onclick=async()=>{if(saving||uploading)return;if(!$('markdown-input').value.trim()){$('editor-status').textContent='先写下一点内容再保存';return}const data={...draft(),modifiedAt:editing.modifiedAt||new Date().toISOString()};editing.modifiedAt=data.modifiedAt;data.attachments=[...new Set([...data.markdown.matchAll(/\/api\/zhuazhua\/image\/([a-f0-9]{64})/g)].map(m=>m[1]))];if(data.sourceURL&&!safeURL(data.sourceURL)){$('editor-status').textContent='来源网址请使用 http 或 https';return}stash();saving=true;lockEditor(true);const started=performance.now();let errorCode='network';$('editor-status').textContent='正在保存…';try{const response=await fetch('/api/zhuazhua/notes',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});errorCode=response.status===409?'conflict':response.status===401?'unauthorized':response.status===400?'validation':'unknown';const result=await response.json();if(response.status===409){$('save-copy').hidden=false;throw Error('这份笔记已在其他地方更新。你的草稿已保留；请复制当前内容，清除草稿后重新打开最新笔记合并，或另存一份。')}if(!response.ok)throw Error(result.error||'保存失败，请重试');if(!result.note||result.note.id!==data.id||!Number.isInteger(result.note.version)||result.note.version<1||typeof result.note.markdown!=='string')throw Error('服务器未确认完整保存结果，请重试');fillEditor(result.note);try{localStorage.removeItem(draftKey)}catch{}$('editor-status').textContent='已保存到知行档案';editing=null;$('editor').close();load();track('note_saved',{durationMs:performance.now()-started})}catch(e){$('editor-status').textContent=e.message+(localDraftAvailable?'（草稿保留在本机）':'（本机存储不可用，请复制当前内容保留）');track('note_save_failed',{errorCode,durationMs:performance.now()-started})}finally{saving=false;lockEditor(false)}};
function lockEditor(value){for(const id of ['note-name','markdown-input','note-tags','note-source','save-note','add-image','import-note','discard-draft','close-editor','save-copy'])$(id).disabled=value}
$('editor').addEventListener('cancel',e=>{if(saving||uploading)e.preventDefault()});
$('save-copy').onclick=()=>{editing={...editing,...blankNote()};stash();$('save-copy').hidden=true;$('save-note').click()};
$('view-metrics').onclick=async()=>{try{const r=await fetch('/api/zhuazhua/metrics?days=7',{credentials:'same-origin'});if(!r.ok)throw Error('暂时无法读取，请稍后重试');const data=await r.json();const labels={note_saved:'笔记保存',note_save_failed:'保存失败',note_opened:'笔记预览',note_editor_opened:'打开编辑器',inbox_list_loaded:'列表加载',search_completed:'搜索完成',image_upload_completed:'图片上传',note_imported:'文字导入',note_sync_completed:'同步成功',note_sync_failed:'同步失败'};const totals={};for(const row of data.items){const item=totals[row.event]||(totals[row.event]={samples:0,duration:0});item.samples+=row.samples;item.duration+=row.durationMs}$('metrics-result').textContent=Object.entries(totals).map(([event,item])=>(labels[event]||event)+' '+item.samples+' 次'+(item.duration?'，平均 '+Math.round(item.duration/item.samples)+' 毫秒':'')).join('；')||'近 7 天还没有体验数据'}catch(e){$('metrics-result').textContent=e.message}};
function insertText(value){const input=$('markdown-input');input.setRangeText(value,input.selectionStart,input.selectionEnd,'end');input.dispatchEvent(new Event('input'));input.focus()}
async function uploadImages(files){if(uploading||saving)return;if(!files.length)return;if(files.some(file=>!file.type.startsWith('image/'))){$('editor-status').textContent='这里只能插入图片；Markdown 或文字文件请使用“导入 .md / .txt”';return}uploading=true;lockEditor(true);try{for(const file of files){if(file.size>64*1024*1024)throw Error('图片超过 64 MB');$('editor-status').textContent='正在保存图片…';const uploadedAt=performance.now();const bytes=await file.arrayBuffer(),digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const now=new Date().toISOString();const response=await fetch('/api/zhuazhua/captures',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({attachmentOnly:true,image:encoded,digest,name:file.name||'note-image',note:'',tags:'',ocr:'',collectedAt:now,modifiedAt:now})});if(!response.ok)throw Error('图片保存失败，可重新插入');insertText('\n![图片](/api/zhuazhua/image/'+digest+')\n');track('image_upload_completed',{durationMs:performance.now()-uploadedAt,count:1})} $('editor-status').textContent='图片已保存，笔记草稿已更新'}catch(e){$('editor-status').textContent=e.message}finally{uploading=false;lockEditor(false)}}
$('add-image').onclick=()=>$('image-file').click();$('image-file').onchange=()=>{uploadImages([...$('image-file').files]);$('image-file').value=''};
$('markdown-input').onpaste=e=>{const files=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));if(files.length){e.preventDefault();uploadImages(files)}};
$('markdown-input').ondragover=e=>e.preventDefault();$('markdown-input').ondrop=e=>{const files=[...e.dataTransfer.files];if(files.length){e.preventDefault();uploadImages(files)}};
$('import-note').onclick=()=>$('text-file').click();$('text-file').onchange=async()=>{const file=$('text-file').files[0];if(!file)return;if(file.size>500000){$('editor-status').textContent='文字文件超过 500 KB';return}const text=await file.text();insertText(text);const references=[...text.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)];$('editor-status').textContent=references.some(m=>!/^\/api\/zhuazhua\/image\/[a-f0-9]{64}$/.test(m[1]))?'文字已导入。相对路径和外部图片尚未导入，请用“插入图片”重新加入对应文件。':'文字已导入，草稿已更新';track('note_imported',{count:1});$('text-file').value=''};
document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{kind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));load()});
load();
</script></body></html>
