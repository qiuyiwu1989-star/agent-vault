<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爪爪收件箱 · 知行档案</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f7f5ef;color:#28372f;font:15px/1.6 system-ui}main{max-width:1440px;margin:auto;padding:32px}a{color:#34664e}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;margin:8px 0}p{color:#68746c}nav,.filters{display:flex;gap:12px;flex-wrap:wrap}input,button{font:inherit;padding:9px 14px;background:white;border:1px solid #d2d9d0;border-radius:9px}button{cursor:pointer;color:inherit}button:disabled{opacity:.5}input[type=search]{flex:1;min-width:220px}.filters{margin:28px 0 12px}#grid{columns:260px;column-gap:20px}.card{display:block;width:100%;break-inside:avoid;margin:0 0 20px;padding:0;overflow:hidden;text-align:left;border-radius:14px;background:white}.card img{display:block;width:100%;height:auto}.caption{padding:12px 15px}.caption strong{display:block;overflow-wrap:anywhere}.caption small{color:#768078}dialog{width:min(1200px,96vw);max-height:94vh;border:0;border-radius:18px;padding:20px;background:#faf9f5}dialog::backdrop{background:#17251ec7}.detail{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:24px;margin-top:16px}#original{width:100%;max-height:74vh;object-fit:contain}pre{white-space:pre-wrap;font:inherit;overflow-wrap:anywhere;max-height:35vh;overflow:auto}#more{display:block;margin:24px auto}#status{min-height:28px}#login{display:none}@media(max-width:700px){main{padding:18px}.detail{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}
</style></head><body><main><header><div><a href="/vault/">← 知行档案</a><h1>爪爪收件箱</h1><p>随手收集，慢慢整理。原图、文字与采集时间一起留下。</p></div><nav><span>私人资料 · 登录可见</span><button id="refresh">刷新</button></nav></header><div class="filters"><input id="q" type="search" placeholder="搜索图片名称、OCR、备注或标签" aria-label="搜索收件箱"><input id="day" type="date" aria-label="采集日期"><button id="clear">全部日期</button></div><p id="status" role="status">正在读取收件箱…</p><a id="login" href="/admin/login.html?next=/vault/inbox/">登录后查看</a><section id="grid" aria-label="采集图片"></section><button id="more" hidden>加载更多</button><dialog id="detail"><header><strong id="title"></strong><button id="close">关闭 Esc</button></header><div class="detail"><a id="full" target="_blank" rel="noopener"><img id="original" alt="原图预览"></a><aside><p id="date"></p><p id="tags"></p><h3>备注</h3><pre id="note"></pre><h3>识别文字</h3><button id="copy">复制文字</button><pre id="ocr"></pre><a id="download" download>保存原图</a></aside></div></dialog></main><script>
const $=id=>document.getElementById(id);let offset=0,generation=0,timer,current=null,loading=false;
function show(item){current=item;$('title').textContent=item.name||'未命名图片';$('original').src=$('full').href=$('download').href=item.imageURL;$('download').download=item.name||'capture';$('date').textContent='采集于 '+new Date(item.collectedAt).toLocaleString('zh-CN')+' · '+item.width+' × '+item.height;$('tags').textContent=item.tags?'标签：'+item.tags:'';$('note').textContent=item.note||'暂无备注';$('ocr').textContent=item.ocr||'暂无识别文字';$('detail').showModal()}
async function load(reset=true){const gen=++generation;if(reset){offset=0;$('grid').replaceChildren()}loading=true;$('more').disabled=true;$('status').textContent='正在读取…';try{const response=await fetch('/api/zhuazhua/captures?'+new URLSearchParams({q:$('q').value,day:$('day').value,offset}),{credentials:'same-origin'});if(response.status===401){$('login').style.display='inline';throw Error('登录已过期，请重新登录')}if(!response.ok)throw Error('暂时无法加载，点击刷新重试');const data=await response.json();if(gen!==generation)return;for(const item of data.items){const card=document.createElement('button');card.className='card';card.onclick=()=>show(item);const img=document.createElement('img');img.src=item.thumbnailURL;img.loading='lazy';img.alt=item.name||'采集图片';img.width=item.width;img.height=item.height;const caption=document.createElement('div');caption.className='caption';const name=document.createElement('strong');name.textContent=item.name;const date=document.createElement('small');date.textContent=new Date(item.collectedAt).toLocaleString('zh-CN');caption.append(name,date);card.append(img,caption);$('grid').append(card)}offset+=data.items.length;$('more').hidden=!data.more;$('status').textContent=offset?'已展示 '+offset+' 张 · 按采集时间排列':'这里还没有匹配的图片。可以从爪爪同步一张。';}catch(e){if(gen===generation)$('status').textContent=e.message}finally{if(gen===generation){loading=false;$('more').disabled=false}}}
$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(),250)};$('day').onchange=()=>load();$('clear').onclick=()=>{$('day').value='';load()};$('refresh').onclick=()=>load();$('more').onclick=()=>{if(!loading)load(false)};$('close').onclick=()=>$('detail').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(current?.ocr||'');$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制文字',1500)}catch{$('copy').textContent='请选择下方文字复制'}};load();
</script></body></html>
