<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研讨原始对话 · 知行档案</title><style>body{background:#faf8f3;color:#292623;font:17px/1.8 system-ui}main{max-width:900px;margin:35px auto;padding:0 22px}a{color:#80513d}h1{font-size:30px}article{border-top:1px solid #ddd;padding:22px 0}article pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}small{color:#68645e}button,select,textarea{font:inherit;padding:10px;border:1px solid #bdb8b0;border-radius:6px}textarea{width:100%;min-height:160px;box-sizing:border-box}button{cursor:pointer;background:#fff}button:disabled{opacity:.6}form,details{margin:30px 0;padding:20px;background:#f0ede5;border-radius:8px}label{display:block;margin:14px 0 8px}#status{min-height:1.8em}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #80513d}</style></head><body><main><a id="back">← 返回研讨总结</a><h1>原始对话</h1><p id="title"></p><p><small>仅本人可见 · 原文按保存顺序保留 · 追加不会覆盖历史，也不会修改公开总结</small></p><p><a id="transcript" target="_blank">查看原始会议转写</a></p><p id="count" role="status">正在加载…</p><div id="messages"></div><button id="more" hidden>加载后续记录</button><form id="append"><h2>追加后续对话</h2><label for="role">这段内容来自</label><select id="role"><option value="user">我的补充</option><option value="assistant">AI 回答</option></select><label for="text">原始内容</label><textarea id="text" required placeholder="粘贴需要保留的原始文字，不必改写为总结"></textarea><p><button id="save" type="submit">保存到这次研讨</button></p><p id="status" role="status"></p></form><details><summary>由 AI 继续追加保存</summary><p>把专用配置交给处理这次研讨的 Agent。它只能追加资料，不能读取私有对话或发布文章。普通公开资料凭据没有此权限。</p><a id="config" download="seminar-dialogue-mcp.json">下载追加保存配置</a><p>该页面不会自动读取其他应用里的聊天。接入后的 Agent 应在继续研讨后追加新消息；完整重传会按来源及消息编号去重。</p><a href="/vault/skills/seminar-settlement/">查看研讨归档 skill</a></details></main><script>
const cfg=__CONFIG__,base='/api/inside/vault/seminar-sources/',query='?id='+encodeURIComponent(cfg.id),$=s=>document.querySelector(s);let next=0,pending=null;
$('#title').textContent=cfg.title;$('#back').href='/vault/seminar/'+encodeURIComponent(cfg.id)+'.html';$('#transcript').href=base+'transcript'+query;$('#config').href=base+'agent-config'+query;
async function load(reset=false){if(reset){$('#messages').replaceChildren();next=0}try{const r=await fetch(base+'messages'+query+'&after='+next);if(!r.ok)throw Error('无法读取，请确认本人登录状态');const d=await r.json();$('#count').textContent=d.total+' 条原始消息';for(const m of d.messages){const a=document.createElement('article'),s=document.createElement('small'),p=document.createElement('pre');s.textContent=(m.role==='user'?'我':'AI')+' · '+(m.timestamp||'原始时间未记录')+' · 来源 '+m.source_id;p.textContent=m.text;a.append(s,p);$('#messages').append(a)}next=d.next_after;$('#more').hidden=next===null;if(!d.total)$('#count').textContent='还没有保存对话，可在下方追加。'}catch(e){$('#count').textContent=e.message}}
$('#more').onclick=()=>load();$('#append').onsubmit=async e=>{e.preventDefault();const text=$('#text').value,role=$('#role').value;if(!pending||pending.messages[0].text!==text||pending.messages[0].role!==role)pending={document_id:cfg.id,source_id:'manual',messages:[{id:crypto.randomUUID(),role,text,timestamp:new Date().toISOString()}]};$('#save').disabled=true;$('#status').textContent='正在保存…';try{const r=await fetch(base+'append'+query,{method:'POST',headers:{'Content-Type':'application/json','Origin':location.origin,'X-Vault-Token':cfg.csrf},body:JSON.stringify(pending)}),d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');$('#status').textContent='已保存。历史原文保持不变。';$('#text').value='';pending=null;await load(true)}catch(e){$('#status').textContent=e.message+'，内容已保留，可重试。'}finally{$('#save').disabled=false}};load();
</script></body></html>
