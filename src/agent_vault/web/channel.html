<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="邱懿武的 Vault 文档频道：阅读档案、榨书、AI 建造者日报与分析文稿。"><title>文档区 Vault · 邱懿武</title><link rel="stylesheet" href="/vault/channel.css?v=3" data-vault-theme="1"><script defer src="/vault/channel.js?v=3"></script></head><body class="vault-channel vault-home"><main><section class="channel-hero"><div><div class="eyebrow">An evolving collection / 持续生长的知识档案</div><h1>读过，留下。<br>连接，再发现。</h1><p>从一篇文章出发，留下阅读的痕迹。<br>把书、观点与实践连在一起，让信息成为自己的判断。</p></div><div class="hero-total" id="total">—<span>份知识成果</span></div></section><section class="channel-toolbar" aria-label="筛选成果"><div class="channel-filters" id="filters"></div><input class="channel-search" id="search" type="search" aria-label="搜索标题摘要或标签" placeholder="搜索标题、摘要或标签…"></section><div class="channel-meta"><span id="count" role="status">正在加载档案…</span><span>按文稿日期 · 新到旧</span></div><section class="waterfall" id="cards" aria-label="成果卡片"></section><div id="empty" class="empty-state" hidden>没有找到相关成果，试试其他关键词。</div><footer class="channel-footer"><span>VAULT · 邱懿武的知识与研究频道</span><a href="/admin/vault/brief">听一份内容简报 ↗</a></footer></main><script>
const names={reading:'阅读档案',books:'榨书档案',digest:'建造者日报',html:'分析文稿'};let rows=[],selected='';const $=s=>document.querySelector(s);function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function render(){const q=$('#search').value.toLowerCase().trim();const found=rows.filter(x=>(!selected||x.collection===selected)&&[x.title,x.summary,...(x.tags||[])].join(' ').toLowerCase().includes(q));$('#count').textContent=(selected?names[selected]:'全部档案')+' · '+found.length+' 份';$('#empty').hidden=!!found.length;$('#cards').replaceChildren(...found.map(x=>{const card=node('article',undefined,'vault-tile');if(x.collection==='books'||x.collection==='html'){const cover=node('div',undefined,'tile-cover');cover.append(node('strong',x.collection==='books'?'书':'思'),node('span',x.collection==='books'?'BOOK NOTES / 深度阅读':'ESSAYS & PROJECTS'));card.append(cover)}const c=node('div',undefined,'tile-content'),top=node('div',undefined,'tile-top');top.append(node('span',names[x.collection]||x.collection,'tile-type'),node('time',x.date||'长期档案'));const h=node('h2'),a=node('a',x.title);a.href=x.url;h.append(a);c.append(top,h);if(x.summary)c.append(node('p',x.summary.slice(0,230)+(x.summary.length>230?'…':''),'tile-summary'));if(x.tags?.length){const tags=node('div',undefined,'tile-tags');for(const t of x.tags.slice(0,4))tags.append(node('span',t));c.append(tags)}const bottom=node('div',undefined,'tile-bottom'),read=node('a','阅读并做笔记 ↗');read.href=x.reader_url;bottom.append(node('span',(x.trust&&!x.trust.startsWith('未标')?x.trust.split('（')[0]:'已归档').slice(0,18)),read);card.append(c,bottom);return card}))}for(const [key,name] of [['','全部'],...Object.entries(names)]){const b=node('button',name);b.type='button';b.className=key===''?'active':'';b.setAttribute('aria-pressed',String(key===''));b.onclick=()=>{selected=key;for(const x of $('#filters').children){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))}render()};$('#filters').append(b)}$('#search').oninput=render;fetch('/vault/catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{rows=x.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.modified-a.modified);$('#total').replaceChildren(document.createTextNode(String(rows.length)),node('span','份知识成果'));render()}).catch(()=>{$('#count').textContent='档案暂时未能加载，请刷新重试。'});
</script></body></html>
