<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="邱懿武的知行档案：阅读、深度读书、建造者观察、思考与作品，以及研讨沉淀。"><title>知行档案 · 邱懿武</title><link rel="stylesheet" href="/vault/channel.css?v=4" data-vault-theme="1"><script defer src="/vault/channel.js?v=4"></script></head><body class="vault-channel vault-home"><main><section class="channel-hero"><div><div class="eyebrow">An evolving collection / 持续生长的知识档案</div><h1>读有所思。<br>思有所行。</h1><p>阅读、思考与实践，留下可继续探索的线索。<br>从原文到判断，从想法到作品，再回来发现新的问题。</p></div><div class="hero-total" id="total">—<span>份知识成果</span></div></section><section class="channel-toolbar" aria-label="筛选成果"><div class="channel-filters" id="filters"></div><input class="channel-search" id="search" type="search" aria-label="搜索标题摘要或标签" placeholder="搜索标题、摘要或标签…"></section><div class="channel-meta"><button id="clear" class="ux-action" type="button" hidden>清除筛选</button><button id="retry" class="ux-action" type="button" hidden>重新加载</button><span id="count" role="status" aria-live="polite">正在加载档案…</span><span>按文稿日期 · 新到旧</span></div><section class="waterfall" id="cards" aria-label="成果卡片"></section><div id="empty" class="empty-state" hidden>没有找到相关成果，试试其他关键词。</div><footer class="channel-footer"><span>知行档案 · 邱懿武的阅读、思考与实践</span><a href="/admin/vault/brief">听一份内容简报 ↗</a></footer></main><script>
const names={reading:'阅读档案',video:'视频频道',books:'深度读书',digest:'建造者观察',html:'思考与作品',seminar:'研讨沉淀'};
const platforms={douyin:'抖音',weixin_channels:'视频号',bilibili:'B站',youtube:'YouTube',wechat:'微信',weixin:'微信'};
const $=s=>document.querySelector(s), params=new URLSearchParams(location.search);
let rows=[],selected=names[params.get('type')]?params.get('type'):'';
$('#search').value=params.get('q')||'';
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function state(){const u=new URL(location.href);selected?u.searchParams.set('type',selected):u.searchParams.delete('type');const q=$('#search').value.trim();q?u.searchParams.set('q',q):u.searchParams.delete('q');history.replaceState(null,'',u)}
function filters(){ $('#filters').replaceChildren(...[['','全部'],...Object.entries(names)].map(([key,label])=>{const b=node('button',label+' '+rows.filter(x=>!key||x.collection===key).length);b.type='button';b.classList.toggle('active',selected===key);b.setAttribute('aria-pressed',String(selected===key));b.onclick=()=>{selected=key;state();filters();render()};return b}));}
function render(){const q=$('#search').value.trim().toLowerCase();const found=rows.filter(x=>(!selected||x.collection===selected)&&[x.title,x.summary,x.source_account,platforms[x.source_platform],...(x.tags||[])].join(' ').toLowerCase().includes(q));$('#count').textContent=(selected?names[selected]:'全部内容')+' · '+found.length+' / '+rows.length+' 份';$('#empty').hidden=!!found.length;$('#clear').hidden=!q&&!selected;$('#cards').replaceChildren(...found.map(x=>{const card=node('article',undefined,'vault-tile'),c=node('div',undefined,'tile-content'),top=node('div',undefined,'tile-top');top.append(node('span',names[x.collection]||'档案','tile-type'),node('time',x.date||'长期档案'));const h=node('h2'),a=node('a',x.title);a.href=x.url;h.append(a);c.append(top,h);if(x.source_platform&&x.source_platform!=='unknown')c.append(node('p',[platforms[x.source_platform]||x.source_platform,x.source_account].filter(Boolean).join(' · '),'tile-source'));if(x.summary)c.append(node('p',x.summary.slice(0,230)+(x.summary.length>230?'…':''),'tile-summary'));if(x.tags?.length){const tags=node('div',undefined,'tile-tags');x.tags.slice(0,4).forEach(t=>tags.append(node('span',t)));c.append(tags)}const bottom=node('div',undefined,'tile-bottom'),read=node('a',(x.collection==='video'?'打开视频档案':x.collection==='html'?'查看作品':'开始阅读')+' →');read.href=x.url;bottom.append(node('span',(x.trust&&!x.trust.startsWith('未标')?x.trust.split('（')[0]:'已归档').slice(0,18)),read);card.append(c,bottom);return card}));}
async function load(){ $('#retry').hidden=true;$('#count').textContent='正在加载内容…';$('#cards').setAttribute('aria-busy','true');try{const r=await fetch('/vault/catalog.json');if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data))throw Error();rows=data.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.modified-a.modified);$('#total').replaceChildren(document.createTextNode(String(rows.length)),node('span','份知识成果'));filters();render()}catch(e){$('#count').textContent='暂时无法加载内容，请重试。';$('#retry').hidden=false}finally{$('#cards').setAttribute('aria-busy','false')}}
$('#search').oninput=()=>{state();render()};$('#clear').onclick=()=>{selected='';$('#search').value='';state();filters();render();$('#search').focus()};$('#retry').onclick=load;load();
</script></body></html>
