<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 接入 · Vault</title><style>main{max-width:900px;margin:45px auto;padding:0 24px;line-height:1.9}section{padding:24px;border:1px solid var(--v-line);border-radius:18px}button{padding:12px;cursor:pointer}</style></head><body><main><h1>Agent 接入</h1><section><h2>只读 MCP</h2><p>提供全文搜索、原文读取、实体统计与证据查询。不能修改文章或读取私人笔记。</p><p>接口：<code>https://qiuyiwu.com/api/vault-mcp</code></p><button id="download">下载 MCP 配置</button><p>配置含访问凭据，请仅交给你授权的智能体。</p><p id="status" role="status"></p></section></main><script>document.querySelector('#download').onclick=async()=>{try{const r=await fetch('/api/inside/vault/knowledge/mcp-config');if(!r.ok)throw Error('请先登录个人工作台');const data=await r.json(),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='vault-mcp-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){document.querySelector('#status').textContent=e.message}};</script></body></html>
