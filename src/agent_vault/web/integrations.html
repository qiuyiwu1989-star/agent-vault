<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 接入 · Vault</title><style>main{max-width:900px;margin:45px auto;padding:0 24px;line-height:1.9}section{padding:24px;border:1px solid var(--v-line);border-radius:18px}button{font:inherit;padding:12px;cursor:pointer}button:disabled{cursor:wait;opacity:.65}textarea{box-sizing:border-box;width:100%;min-height:240px;padding:12px;font:14px/1.6 monospace;background:var(--v-bg,transparent);color:inherit;border:1px solid var(--v-line);border-radius:8px}#manual[hidden]{display:none}</style></head><body><main><h1>Agent 接入</h1><section><h2>只读 MCP</h2><p>提供全文搜索、原文读取、实体统计、证据查询，以及研讨沉淀 Skill。不能修改文章或读取私人笔记。</p><p>接口：<code>https://qiuyiwu.com/api/vault-mcp</code></p><button id="copyRead">复制 MCP 配置</button><p>配置含访问凭据，请仅交给你授权的智能体。</p><h2>HTML 写入 MCP</h2><p>可发布新的 HTML 成果和研讨沉淀文章，返回网站链接，不覆盖已有作品。写入凭证请单独保管。</p><p>研讨流程：调用 <code>vault_get_seminar_skill</code> 获取方法；完成成稿后用 <code>vault_publish_seminar</code> 写回。录音转写和后续对话由外部服务提供。</p><button id="copyWrite">复制 HTML 写入配置</button><p id="status" role="status" aria-live="polite"></p><div id="manual" hidden><label for="configText">手动复制完整配置</label><textarea id="configText" readonly spellcheck="false"></textarea><button id="hideConfig">收起配置</button></div></section></main><script>
const status=document.querySelector('#status'),manual=document.querySelector('#manual'),text=document.querySelector('#configText');
function clearConfig(){manual.hidden=true;text.value=''}
async function copyConfig(write,button){clearConfig();button.disabled=true;status.textContent='正在获取配置…';try{const r=await fetch('/api/inside/vault/knowledge/mcp-config'+(write?'?scope=html-write':''));if(!r.ok)throw Error(r.status===401||r.status===403?'请先登录个人工作台':'暂时无法获取配置，请重试');const config=JSON.stringify(await r.json(),null,2);try{await navigator.clipboard.writeText(config);status.textContent=(write?'HTML 写入配置':'只读 MCP 配置')+'已复制，可以直接粘贴到智能体的 MCP 设置。'}catch{manual.hidden=false;text.value=config;text.focus();text.select();status.textContent='浏览器未允许自动复制，已选中完整配置，请按 Ctrl+C 或 ⌘C 复制。'}}catch(e){status.textContent=e.message}finally{button.disabled=false}}
document.querySelector('#copyRead').onclick=function(){copyConfig(false,this)};document.querySelector('#copyWrite').onclick=function(){copyConfig(true,this)};document.querySelector('#hideConfig').onclick=()=>{clearConfig();status.textContent='配置已收起'};window.addEventListener('pagehide',clearConfig);
</script></body></html>
